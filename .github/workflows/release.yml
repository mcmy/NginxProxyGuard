name: Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io

jobs:
  # ============================================================
  # Step 1: Detect Changes
  # ============================================================
  detect:
    name: 🔍 Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      image_prefix: ${{ steps.version.outputs.image_prefix }}
      api_changed: ${{ steps.changes.outputs.api }}
      ui_changed: ${{ steps.changes.outputs.ui }}
      nginx_changed: ${{ steps.changes.outputs.nginx }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9_][A-Za-z0-9_.-]*)?$ || ${#VERSION} -gt 117 ]]; then
            echo "::error::Unsupported release version: $VERSION"
            exit 1
          fi
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          REPOSITORY=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          echo "image_prefix=$REGISTRY/$REPOSITORY" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Check component changes
        id: changes
        env:
          IMAGE_PREFIX: ${{ steps.version.outputs.image_prefix }}
        run: |
          # Unchanged components reuse the stable latest image, so compare
          # against a stable tag. A test tag never updates latest.
          PREV_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' \
            --exclude 'v*-*' --exclude 'v*.*.*.*' HEAD^ 2>/dev/null || true)

          if [ -z "$PREV_TAG" ]; then
            echo "No prior stable tag found. Building all components."
            echo "api=true" >> "$GITHUB_OUTPUT"
            echo "ui=true" >> "$GITHUB_OUTPUT"
            echo "nginx=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED_FILES=$(git diff --name-only "$PREV_TAG" HEAD)
          check_changes() {
            local component=$1
            if grep -q "^${component}/" <<< "$CHANGED_FILES"; then
              echo "$component=true" >> "$GITHUB_OUTPUT"
            elif docker buildx imagetools inspect "$IMAGE_PREFIX-$component:latest" >/dev/null 2>&1; then
              echo "$component=false" >> "$GITHUB_OUTPUT"
            else
              echo "No reusable GHCR image for $component. Building it from this tag."
              echo "$component=true" >> "$GITHUB_OUTPUT"
            fi
          }

          check_changes "api"
          check_changes "ui"
          check_changes "nginx"

  # ============================================================
  # Step 2: Build Images (Parallel, Native Multi-Arch)
  # ============================================================
  build-api:
    name: 🔨 Build API (${{ matrix.arch }})
    needs: detect
    if: needs.detect.outputs.api_changed == 'true'
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_PREFIX: ${{ needs.detect.outputs.image_prefix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push (test tag)
        uses: docker/build-push-action@v7
        with:
          context: ./api
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-api:${{ needs.detect.outputs.version }}-test-${{ matrix.arch }}
          cache-from: type=gha,scope=api-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=api-${{ matrix.arch }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          provenance: false

  build-ui:
    name: 🔨 Build UI (${{ matrix.arch }})
    needs: detect
    if: needs.detect.outputs.ui_changed == 'true'
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_PREFIX: ${{ needs.detect.outputs.image_prefix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push (test tag)
        uses: docker/build-push-action@v7
        with:
          context: ./ui
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-ui:${{ needs.detect.outputs.version }}-test-${{ matrix.arch }}
          cache-from: type=gha,scope=ui-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ui-${{ matrix.arch }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          provenance: false

  build-nginx:
    name: 🔨 Build Nginx (${{ matrix.arch }})
    needs: detect
    if: needs.detect.outputs.nginx_changed == 'true'
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_PREFIX: ${{ needs.detect.outputs.image_prefix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push (test tag)
        uses: docker/build-push-action@v7
        with:
          context: ./nginx
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-nginx:${{ needs.detect.outputs.version }}-test-${{ matrix.arch }}
          cache-from: type=gha,scope=nginx-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=nginx-${{ matrix.arch }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          provenance: false

  # ============================================================
  # Step 3: Create Test Manifests
  # ============================================================
  create-test-manifests:
    name: 📦 Create Test Manifests
    needs: [detect, build-api, build-ui, build-nginx]
    if: ${{ !cancelled() && !failure() && needs.detect.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
    env:
      IMAGE_PREFIX: ${{ needs.detect.outputs.image_prefix }}

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Create API manifest
        if: needs.detect.outputs.api_changed == 'true' && needs.build-api.result == 'success'
        run: |
          docker buildx imagetools create --tag ${{ env.IMAGE_PREFIX }}-api:${{ needs.detect.outputs.version }}-test \
            ${{ env.IMAGE_PREFIX }}-api:${{ needs.detect.outputs.version }}-test-amd64 \
            ${{ env.IMAGE_PREFIX }}-api:${{ needs.detect.outputs.version }}-test-arm64

      - name: Create UI manifest
        if: needs.detect.outputs.ui_changed == 'true' && needs.build-ui.result == 'success'
        run: |
          docker buildx imagetools create --tag ${{ env.IMAGE_PREFIX }}-ui:${{ needs.detect.outputs.version }}-test \
            ${{ env.IMAGE_PREFIX }}-ui:${{ needs.detect.outputs.version }}-test-amd64 \
            ${{ env.IMAGE_PREFIX }}-ui:${{ needs.detect.outputs.version }}-test-arm64

      - name: Create Nginx manifest
        if: needs.detect.outputs.nginx_changed == 'true' && needs.build-nginx.result == 'success'
        run: |
          docker buildx imagetools create --tag ${{ env.IMAGE_PREFIX }}-nginx:${{ needs.detect.outputs.version }}-test \
            ${{ env.IMAGE_PREFIX }}-nginx:${{ needs.detect.outputs.version }}-test-amd64 \
            ${{ env.IMAGE_PREFIX }}-nginx:${{ needs.detect.outputs.version }}-test-arm64

  # ============================================================
  # Step 4: E2E Tests - Host Mode
  # ============================================================
  test-host:
    name: 🧪 Test (Host Mode)
    needs: [detect, build-api, build-ui, build-nginx, create-test-manifests]
    if: ${{ !cancelled() && needs.create-test-manifests.result == 'success' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read
    env:
      IMAGE_PREFIX: ${{ needs.detect.outputs.image_prefix }}
      NGINX_HTTP_PORT: 28080
      NGINX_HTTPS_PORT: 28443
      API_HOST_PORT: 29080
      WHOAMI_PORT: 28888

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Prepare test images
        env:
          VERSION: ${{ needs.detect.outputs.version }}
          API_CHANGED: ${{ needs.detect.outputs.api_changed }}
          UI_CHANGED: ${{ needs.detect.outputs.ui_changed }}
          NGINX_CHANGED: ${{ needs.detect.outputs.nginx_changed }}
        run: |
          pull_image() {
            local component=$1
            local changed=$2

            local image="$IMAGE_PREFIX-$component"
            local source=latest
            if [ "$changed" == "true" ]; then
              source="$VERSION-test"
            fi
            docker pull "$image:$source"
            docker tag "$image:$source" "$image:$VERSION"
          }

          pull_image "api" "$API_CHANGED"
          pull_image "ui" "$UI_CHANGED"
          pull_image "nginx" "$NGINX_CHANGED"

      - name: Start test environment
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          docker compose -f docker-compose.release-test-host.yml up -d db valkey api nginx whoami

      - name: Wait for services
        run: |
          echo "⏳ Waiting for API..."
          timeout 120s bash -c '
            until docker compose -f docker-compose.release-test-host.yml ps 2>/dev/null | grep -E "release-test-host-api.*healthy"; do
              sleep 5
            done
          '
          echo "⏳ Waiting for Nginx..."
          timeout 60s bash -c '
            until docker compose -f docker-compose.release-test-host.yml ps 2>/dev/null | grep -E "release-test-host-nginx.*healthy"; do
              sleep 5
            done
          '
          echo "⏳ Waiting for Whoami to start..."
          sleep 5  # Simple wait - traefik/whoami has no healthcheck tools
          echo "✅ All services ready"
          docker compose -f docker-compose.release-test-host.yml ps

      - name: Run E2E tests
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          docker compose -f docker-compose.release-test-host.yml run --rm test-runner

      - name: Show logs (on failure)
        if: failure()
        run: |
          echo "::group::API Logs"
          docker compose -f docker-compose.release-test-host.yml logs api
          echo "::endgroup::"
          echo "::group::Nginx Logs"
          docker compose -f docker-compose.release-test-host.yml logs nginx
          echo "::endgroup::"
          echo "::group::Whoami Logs"
          docker compose -f docker-compose.release-test-host.yml logs whoami
          echo "::endgroup::"

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.release-test-host.yml down -v

  # ============================================================
  # Step 5: Create Final Manifests (retag test images)
  # ============================================================
  create-manifests:
    name: 📦 Create Final Manifests
    needs: [detect, test-host]
    if: always() && needs.test-host.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    env:
      IMAGE_PREFIX: ${{ needs.detect.outputs.image_prefix }}

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish versioned manifests
        env:
          VERSION: ${{ needs.detect.outputs.version }}
          PRERELEASE: ${{ needs.detect.outputs.prerelease }}
          API_CHANGED: ${{ needs.detect.outputs.api_changed }}
          UI_CHANGED: ${{ needs.detect.outputs.ui_changed }}
          NGINX_CHANGED: ${{ needs.detect.outputs.nginx_changed }}
        run: |
          publish_manifest() {
            local image="$IMAGE_PREFIX-$1"
            local changed=$2
            local source=latest
            local -a tags=(--tag "$image:$VERSION")

            if [ "$changed" == "true" ]; then
              source="$VERSION-test"
              if [ "$PRERELEASE" != true ]; then
                tags+=(--tag "$image:latest")
              fi
            fi

            docker buildx imagetools create "${tags[@]}" "$image:$source"
          }

          publish_manifest api "$API_CHANGED"
          publish_manifest ui "$UI_CHANGED"
          publish_manifest nginx "$NGINX_CHANGED"

  # ============================================================
  # Step 6: Create GitHub Release
  # ============================================================
  release:
    name: 📦 Create Release
    needs: [detect, create-manifests]
    if: always() && needs.create-manifests.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get release notes
        id: release_notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"

          # 1. 기존 릴리즈 노트 확인 (수동 작성된 것이 있으면 보존)
          EXISTING=$(gh release view "$TAG_NAME" --json body --jq '.body' 2>/dev/null || echo "")

          # 1b. 체크인된 사용자 작성 릴리스 노트 (docs/release-notes/<tag>.md).
          #     커밋 로그 자동 생성(아래 3번)은 개발용 노이즈가 많으므로, 릴리스 시
          #     이 파일에 사용자 관점 changelog를 작성해 버전 bump 커밋에 포함하면
          #     그대로 발행된다. (Docker Images 블록은 Create Release 스텝이 append)
          FILE_NOTES=""
          if [ -f "docs/release-notes/${TAG_NAME}.md" ]; then
            FILE_NOTES=$(cat "docs/release-notes/${TAG_NAME}.md")
          fi

          # 2. Annotated tag 메시지 확인
          # `git tag -l --format='%(contents)'` returns the underlying commit
          # message for lightweight tags, which leaks the release commit body
          # into release notes. Only read tag contents when the tag object is
          # actually an annotated tag.
          if [ "$(git cat-file -t "$TAG_NAME" 2>/dev/null)" = "tag" ]; then
            TAG_MSG=$(git tag -l --format='%(contents)' "$TAG_NAME" | tail -n +2 | sed '/^$/d')
          else
            TAG_MSG=""
          fi

          # 3. 이전 태그부터 현재까지 커밋 로그로 자동 생성 (Conventional Commit type별 그룹핑)
          #    feat -> 🚀 신기능, fix -> 🛡️ 버그 수정, perf -> ⚡ 성능,
          #    docs/chore/test/refactor/style 는 접이식 Internal 섹션으로 정리.
          #    (수동 작성 노트가 있으면 위 우선순위에서 보존되므로 이 블록은 fallback)
          #    주의: 모든 입력은 git log(커밋 제목) -> 따옴표 변수 -> grep/sed/printf '%s'
          #    로만 처리하며 eval/템플릿 보간이 없어 악성 커밋 메시지도 데이터로만 취급됨.
          PREV_TAG_FOR_LOG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          AUTO_NOTES=""
          if [ -n "$PREV_TAG_FOR_LOG" ]; then
            # `|| true`: an empty match here is valid (e.g. a release whose range
            # is only release:/Merge commits) and must not trip `set -e`.
            ALL=$(git log --pretty=format:"%s" "$PREV_TAG_FOR_LOG..HEAD" | grep -vE "^(release:|Merge )" || true)
            # `|| true`: the subshell's final statement is a `[ -n ... ] && printf`
            # guard whose test is false when a section (e.g. Internal) has no
            # commits, returning non-zero. Without this a fix-only release fails.
            AUTO_BODY=$(
              section() {
                local body
                body=$(printf '%s\n' "$ALL" | grep -E "^($2)(\([^)]*\))?: " | sed -E "s/^($2)(\([^)]*\))?: */- /")
                [ -n "$body" ] && printf '### %s\n\n%s\n\n' "$1" "$body"
              }
              section "🚀 New Features" "feat"
              section "🛡️ Bug Fixes" "fix"
              section "⚡ Performance" "perf"
              OTHER=$(printf '%s\n' "$ALL" | grep -vE "^(feat|fix|perf|docs|chore|test|refactor|style)(\([^)]*\))?: " | sed 's/^/- /')
              [ -n "$OTHER" ] && printf '### Other\n\n%s\n\n' "$OTHER"
              INTERNAL=$(printf '%s\n' "$ALL" | grep -E "^(docs|chore|test|refactor|style)(\([^)]*\))?: " | sed -E 's/^[a-z]+(\([^)]*\))?: */- /')
              [ -n "$INTERNAL" ] && printf '<details><summary>🔧 Internal (docs / chore / tests / refactor)</summary>\n\n%s\n</details>\n' "$INTERNAL"
            ) || true
            if [ -n "$AUTO_BODY" ]; then
              AUTO_NOTES=$(printf "## What's Changed\n\n%s" "$AUTO_BODY")
            fi
          fi

          # 우선순위: 기존 릴리즈 노트 > 체크인 노트 파일 > 태그 메시지 > 자동 생성
          if [ -n "$EXISTING" ]; then
            NOTES="$EXISTING"
          elif [ -n "$FILE_NOTES" ]; then
            NOTES="$FILE_NOTES"
          elif [ -n "$TAG_MSG" ]; then
            NOTES="$TAG_MSG"
          elif [ -n "$AUTO_NOTES" ]; then
            NOTES="$AUTO_NOTES"
          else
            NOTES=""
          fi

          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # 외부 기여자 수집 (중복 제거)
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          CONTRIBUTORS=""
          if [ -n "$PREV_TAG" ]; then
            PR_NUMBERS=$(git log --pretty=format:"%s %b" "$PREV_TAG..HEAD" | grep -oE '#[0-9]+' | sort -u | tr -d '#')
            SEEN=""
            for PR in $PR_NUMBERS; do
              PR_AUTHOR=$(gh pr view "$PR" --json author --jq '.author.login' 2>/dev/null || echo "")
              if [ -n "$PR_AUTHOR" ] && [ "$PR_AUTHOR" != "svrforum" ] && ! echo "$SEEN" | grep -qw "$PR_AUTHOR"; then
                SEEN="$SEEN $PR_AUTHOR"
                if [ -z "$CONTRIBUTORS" ]; then
                  CONTRIBUTORS="@$PR_AUTHOR"
                else
                  CONTRIBUTORS="$CONTRIBUTORS, @$PR_AUTHOR"
                fi
              fi
            done
          fi
          echo "contributors=$CONTRIBUTORS" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: v${{ needs.detect.outputs.version }}
          body: |
            ${{ steps.release_notes.outputs.notes }}

            ---

            ## Docker Images

            ```bash
            docker pull ${{ needs.detect.outputs.image_prefix }}-api:${{ needs.detect.outputs.version }}
            docker pull ${{ needs.detect.outputs.image_prefix }}-ui:${{ needs.detect.outputs.version }}
            docker pull ${{ needs.detect.outputs.image_prefix }}-nginx:${{ needs.detect.outputs.version }}
            ```

            **Architectures:** `linux/amd64`, `linux/arm64`

            | Component | Status |
            |-----------|--------|
            | API | ${{ needs.detect.outputs.api_changed == 'true' && 'Built' || 'Skipped (no changes)' }} |
            | UI | ${{ needs.detect.outputs.ui_changed == 'true' && 'Built' || 'Skipped (no changes)' }} |
            | Nginx | ${{ needs.detect.outputs.nginx_changed == 'true' && 'Built' || 'Skipped (no changes)' }} |

            ${{ steps.release_notes.outputs.contributors != '' && format('**Contributors:** {0}', steps.release_notes.outputs.contributors) || '' }}
          draft: false
          prerelease: ${{ needs.detect.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.detect.outputs.prerelease == 'true' && 'false' || 'true' }}

  # ============================================================
  # Cleanup on Failure
  # ============================================================
  cleanup-on-failure:
    name: 🧹 Cleanup (on failure)
    needs: [detect, test-host]
    if: failure() && needs.detect.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Delete tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          echo "❌ Tests failed. Deleting tag $TAG_NAME..."
          gh release delete "$TAG_NAME" --yes 2>/dev/null || true
          git push origin :refs/tags/$TAG_NAME || true
          echo "🔧 Please fix the issues and create a new tag."
